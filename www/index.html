<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管院空間管理系統</title>
    <link rel="stylesheet" href="/common/common.css">
    <link rel="stylesheet" href="/index.css">
</head>
<body>
    <main class="container">
        <section class="welcome">
            <h1>管院空間管理系統</h1>
            <p id="welcome-text" class="text-muted">查詢管院空間、預約借用教室與物品、登記排課。</p>
        </section>

        <section class="module-list">
            <a class="card module-card" href="/space/">
                <h2>空間查詢</h2>
                <p>瀏覽管院教室資訊、360 全景照片與平面圖。</p>
                <span class="text-muted">免登入</span>
            </a>
            <a class="card module-card" href="/booking/">
                <h2>空間/物品預約借用</h2>
                <p>查看教室每週借用狀況，預約借用教室與物品。</p>
                <span class="text-muted">瀏覽免登入，借用需登入</span>
            </a>
            <a class="card module-card" href="/course/">
                <h2>排課</h2>
                <p>老師登記排課時段，檢視每週排課狀態。</p>
                <span class="text-muted">需登入</span>
            </a>
        </section>
    </main>

    <script src="/common/common.js"></script>
    <script src="/index.js"></script>
</body>
</html>
