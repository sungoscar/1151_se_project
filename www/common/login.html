<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入｜管院空間管理系統</title>
    <link rel="stylesheet" href="/common/common.css">
    <link rel="stylesheet" href="/common/login.css">
</head>
<body>
    <main class="container container-narrow">
        <!-- 登入表單 -->
        <section class="card" id="login-section">
            <h1>登入</h1>
            <div id="login-message" class="message"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">帳號</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-full">登入</button>
            </form>

            <p class="text-muted switch-link" id="register-link">
                還沒有帳號？<a href="/common/register.html">申請帳號</a>
            </p>
        </section>

        <!-- 被退件時顯示：退件原因與重新申請表單 -->
        <section class="card hidden" id="reapply-section">
            <h1>重新申請</h1>
            <div class="message message-error">
                您的帳號申請未通過審核。<br>
                退件原因：<span id="reject-comment"></span>
            </div>
            <div id="reapply-message" class="message"></div>

            <form id="reapply-form">
                <div class="form-group">
                    <label>帳號</label>
                    <input type="text" id="reapply-username" disabled>
                </div>
                <div class="form-group">
                    <label for="reapply-name">姓名</label>
                    <input type="text" id="reapply-name" required>
                </div>
                <div class="form-group">
                    <label for="reapply-role">身分</label>
                    <select id="reapply-role" required>
                        <option value="student">學生</option>
                        <option value="teacher">老師</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="reapply-password">密碼</label>
                    <input type="password" id="reapply-password" required autocomplete="current-password">
                    <p class="form-hint">請再輸入一次密碼，確認是本人送出</p>
                </div>
                <button type="submit" class="btn btn-full">重新送出申請</button>
            </form>

            <p class="text-muted switch-link">
                <a href="/common/login.html">返回登入</a>
            </p>
        </section>
    </main>

    <script src="/common/common.js"></script>
    <script src="/common/login.js"></script>
</body>
</html>
